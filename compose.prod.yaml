services:
  app:
    build:
      context: ./okozukai-api
      dockerfile: docker/php/Dockerfile

    container_name: okozukai-app

    working_dir: /var/www/html

    volumes:
      - ./okozukai-api:/var/www/html

    depends_on:
      - db

    restart: unless-stopped

  nginx:
    image: nginx:alpine

    container_name: okozukai-nginx

    ports:
      - "80:80"

    volumes:
      - ./okozukai-api:/var/www/html
      - ./okozukai-api/docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    restart: unless-stopped

  db:
    image: mysql:8.4

    container_name: okozukai-db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: